name: build

on:
  push:
    branches: ['ci/**', 'diktat/**']
  workflow_dispatch:

jobs:
  local:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Bauen (make local)
        run: make local 2>&1 | tee build.log
      - name: App packen
        if: success()
        run: |
          echo "::notice::Downloads: $(ls "$HOME/Downloads" | tr '\n' ' ')"
          ditto -c -k --keepParent "$HOME/Downloads/VoiceInk.app" app.zip || echo "::error::ditto fehlgeschlagen"
          ls -la app.zip
      - name: Fehler aus Log melden
        if: always()
        run: |
          grep -E "error:|\*\* BUILD|fatal" build.log | head -30 | while read -r l; do echo "::error::${l:0:400}"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            app.zip
            build.log
